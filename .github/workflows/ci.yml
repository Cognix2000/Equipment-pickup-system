# ADR-006 e ADR-007: todo PR passa por aqui. A main só aceita merge com tudo verde.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  titulo-do-pr:
    name: Título no padrão Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Confere o título
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|docs|test|refactor|perf|chore|ci|build)(\([a-z0-9-]+\))?!?: .+'
          if ! echo "$TITULO" | grep -Eq "$padrao"; then
            echo "::error::Use 'tipo(modulo): descrição'. Ex.: feat(ordens): registrar retirada (RF12)"
            exit 1
          fi

  backend:
    name: API .NET
    runs-on: ubuntu-latest
    services:
      banco:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: retirada_teste
          POSTGRES_USER: retirada_dono
          POSTGRES_PASSWORD: senha_so_do_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retirada_dono -d retirada_teste"
          --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # RN14: o mesmo armazenamento S3 da homologação, para testar o adaptador de verdade.
      # Contêiner à mão (e não "services") porque precisa do arquivo de chaves e do comando "server".
      - name: Armazenamento das fotos (SeaweedFS)
        run: |
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"retirada","secretKey":"senha-de-teste"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name fotos -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333 && exit 0; sleep 1; done
          docker logs fotos; exit 1
      - run: dotnet restore
      # Falha alta ou crítica conhecida em pacote NuGet (direto ou transitivo) barra o PR. O Dependabot abre a atualização.
      - name: Dependências com falha conhecida
        run: |
          relatorio=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$relatorio"
          if grep -qE '\b(High|Critical)\b' <<<"$relatorio"; then
            echo "::error::Há pacote NuGet com falha alta ou crítica. Atualize a versão."
            exit 1
          fi
      - run: dotnet build --no-restore -c Release
      - name: Testes (unidade, banco, armazenamento, arquitetura e contrato da API)
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"
        env:
          RETIRADA_TESTE_BANCO: Host=localhost;Database=retirada_teste;Username=retirada_dono;Password=senha_so_do_ci;GSS Encryption Mode=Disable
          RETIRADA_TESTE_S3: http://localhost:8333

  frontend:
    name: PWA React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Só o que vai para o app (sem as ferramentas de build) e só falha alta ou crítica: as moderadas ficam com o Dependabot.
      - name: Dependências com falha conhecida
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - name: Testes de tela (ponta a ponta, acessibilidade, rolagem lateral e capturas)
        run: npm run test:e2e
      - name: Relatório e capturas novas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            frontend/playwright-report
            frontend/e2e/**/*-snapshots
          retention-days: 14

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Monta as imagens da API e do PWA
        run: |
          sh ferramentas/criar-env.sh homologacao
          docker compose build
