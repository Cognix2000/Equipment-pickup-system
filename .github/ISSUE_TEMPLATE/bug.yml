name: Bug
description: Algo que não funciona como o requisito diz
title: "fix(modulo): "
labels: ["tipo: bug"]
body:
  - type: markdown
    attributes:
      value: "Nunca cole dado real de cliente aqui (nome, telefone, endereço). Use o número da OS."
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
      description: Cite o RF ou a RN, se souber
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como técnico em homologação
        2. Abrir a OS 5101
        3. ...
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Onde
      options: [homologação, produção, desenvolvimento]
    validations:
      required: true
  - type: input
    id: rastro
    attributes:
      label: Id do rastro (traceId), se apareceu na tela de erro
