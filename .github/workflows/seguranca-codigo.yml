# ADR-007: análise estática de segurança (SAST) em todo PR e toda semana.
name: Segurança do código

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # segunda, 03h17 em Brasília

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linguagem: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
