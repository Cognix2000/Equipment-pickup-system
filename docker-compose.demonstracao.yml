# Modo demonstração no servidor: soma-se à produção, ANTES de entrar com dados reais.
# Liga com MODO_DEMONSTRACAO=true no .env; o deploy/atualizar.sh inclui este arquivo sozinho.
#
# - Carrega os usuários de teste (gestor, financeiro, técnico e estoque @exemplo.invalid) e as ordens fictícias.
# - A senha deles vem de SENHA_DEMONSTRACAO (gerada no servidor): o site está aberto na internet, então a senha
#   do README, que vale só na homologação local, não serve aqui.
# - Aceita telefone com DDD 00, para o contato funcionar com os dados fictícios (RN05).
#
# Para começar com dados reais, zere tudo (docs/implantacao.md, "Sair do modo demonstração"): ordens e
# históricos nunca são apagados pela aplicação (RN12), então o teste não pode ficar misturado com o real.
services:
  migrador:
    command: ["migrar", "--dados-ficticios", "/dados-ficticios/demo.sql"]
    environment:
      Demonstracao__Senha: ${SENHA_DEMONSTRACAO:?defina SENHA_DEMONSTRACAO no .env (openssl rand -base64 18)}

  api:
    environment:
      Importacao__ModoSimulacao: "true"
