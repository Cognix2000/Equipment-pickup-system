# Produção: soma-se ao docker-compose.yml, que continua sendo a homologação.
# As imagens vêm prontas do GHCR (workflow "Publicar imagens"): o servidor não compila nada.
#   sh ferramentas/criar-env.sh producao <domínio> <versão>   # cria o .env com senhas aleatórias
#   sh deploy/atualizar.sh             # código e imagens na VERSAO do .env (uma tag lançada) e sobe tudo
#
# O que muda em relação à homologação:
# - HTTPS no domínio do .env (Caddy, certificado automático) e HTTP redirecionado para HTTPS;
# - sem carga de dados fictícios: o primeiro gestor entra por convite (README, "Primeiro gestor em produção");
# - telefone com DDD 00 deixa de valer (RN05);
# - tudo reinicia sozinho quando o servidor religa, e os logs não enchem o disco.

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  banco:
    <<: *logs
    restart: unless-stopped

  migrador:
    <<: *logs
    image: ghcr.io/cognix2000/retirada-api:${VERSAO:?defina VERSAO no .env com uma tag como v0.1.0}
    command: ["migrar"]

  api:
    <<: *logs
    image: ghcr.io/cognix2000/retirada-api:${VERSAO:?defina VERSAO no .env com uma tag como v0.1.0}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Importacao__ModoSimulacao: "false"
      # ADR-012: a chave de acesso (passkey) fica presa a este domínio; em outro endereço, não funciona.
      Acesso__ChaveDeAcesso__Dominio: ${DOMINIO:?defina DOMINIO no .env}
      Acesso__ChaveDeAcesso__Origens: https://${DOMINIO}
      # Repasse ao técnico por retirada conferida, em centavos (500 = R$ 5,00). Muda no .env, sem mexer neste arquivo.
      Ordens__ValorPorRetiradaCentavos: ${VALOR_POR_RETIRADA_CENTAVOS:-500}
      # Mapa com as ruas de verdade (OpenFreeMap). A homologação usa a cidade simulada dos dados fictícios.
      Mapa__Estilo: real
      # ADR-014: resgate do técnico terceiro por PIX pelo Asaas. Desligado até a conta da Netwise existir;
      # o passo a passo está em docs/implantacao.md, "Resgate por PIX (Asaas)".
      Pagamentos__Gateway: ${PAGAMENTOS_GATEWAY:-desligado}
      Pagamentos__ResgateMinimoCentavos: ${RESGATE_MINIMO_CENTAVOS:-2000}
      Pagamentos__Asaas__Endereco: ${ASAAS_ENDERECO:-https://api.asaas.com}
      Pagamentos__Asaas__ChaveDaApi: ${ASAAS_CHAVE_DA_API:-}
      Pagamentos__Asaas__TokenDoWebhook: ${ASAAS_TOKEN_DO_WEBHOOK:-}
      # Push: vazio desativa o recurso (RF — notificações no PWA). Gerar com: npx web-push generate-vapid-keys
      Push__VapidPublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${PUSH_VAPID_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_SUBJECT:-}

  fotos:
    <<: *logs
    restart: unless-stopped

  web:
    <<: *logs
    image: ghcr.io/cognix2000/retirada-web:${VERSAO:?defina VERSAO no .env com uma tag como v0.1.0}
    restart: unless-stopped

  proxy:
    <<: *logs
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e conta da Let's Encrypt. Perder este volume força emitir de novo (há limite semanal).
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  # Observabilidade leve: expõem métricas só na VPN (wg0), para um Grafana/Prometheus externo fazer scrape.
  # Sem Loki/Tempo/Grafana aqui: o disco deste servidor não comporta (ver docs/adr/0008-observabilidade.md).
  node-exporter:
    <<: *logs
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)"
    ports:
      - "${REDE_VPN_IP:?defina REDE_VPN_IP no .env}:9100:9100"

  cadvisor:
    <<: *logs
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    # Docker 29 usa containerd como snapshotter; cAdvisor precisa falar com o containerd direto
    # (o layout clássico de /var/lib/docker/.../layerdb não existe mais nesse modo).
    command:
      - "--docker_only=true"
      - "--containerd=/var/run/containerd/containerd.sock"
      - "--containerd-namespace=moby"
    ports:
      - "${REDE_VPN_IP:?defina REDE_VPN_IP no .env}:8081:8080"

volumes:
  caddy_dados:
  caddy_config:
