# Implanta automaticamente no servidor quando uma versão é publicada.
# ADR-006: a produção só recebe tag. O workflow entra em cena só depois que a release é publicada
# e que o "Publicar imagens" já subiu as imagens daquela tag no GHCR.
#
# Usa um self-hosted runner no próprio servidor (rótulo 'producao'). O SSH do servidor fica
# fechado para a internet (só pela VPN WireGuard), então o GitHub Actions não entra por fora:
# o agente roda de dentro e executa o 'atualizar.sh' local. Instruções de instalação do runner
# em docs/implantacao.md, "Implantação automática".
#
# Como rodar sozinho (Actions › "Implantar na produção" › Run workflow): informe a tag (ex.: v0.2.0).
# Isso serve para repetir um deploy que falhou sem precisar republicar a release.
name: Implantar na produção

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versao:
        description: "Tag a implantar (ex.: v0.2.0). Precisa já existir no repo e no GHCR."
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: implantar-producao
  cancel-in-progress: false # dois deploys ao mesmo tempo quebrariam o compose; o segundo espera

jobs:
  implantar:
    name: Atualizar o servidor na tag
    # O agente só pega jobs rotulados 'producao', para não confundir com futuros runners em outras máquinas.
    runs-on: [self-hosted, producao]
    # Segurança: só roda com a aprovação do dono do ambiente no painel de Environments do GitHub.
    # Crie o Environment "producao" em Settings › Environments e marque "Required reviewers" com você mesmo.
    environment:
      name: producao
      url: https://pedro.devioslab.com.br
    steps:
      - name: Descobrir a versão
        id: versao
        run: |
          versao="${{ github.event.inputs.versao || github.ref_name }}"
          if [[ ! "$versao" =~ ^v\.?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $versao. Use vX.Y.Z." >&2
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"

      - name: Entrar no GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Atualizar na mesma pasta do agente
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -eu
          # O self-hosted runner é instalado por cladmin, dentro de ~/actions-runner/. O repositório
          # de produção fica ao lado, em ~/retirada (padrão), e pode ser trocado pela variável abaixo.
          pasta="${IMPLANTACAO_PASTA:-$HOME/retirada}"
          cd "$pasta"
          if [ ! -f .env ]; then
            echo "Sem .env em $pasta. Faça a primeira vez manualmente (docs/implantacao.md)." >&2
            exit 1
          fi
          # Backup carimbado do .env antes de alterar, para voltar sem drama.
          cp .env ".env.bak.$(date -u +%Y%m%dT%H%M%SZ)"
          # Mantém só os 3 backups mais recentes do .env (disco do servidor é pequeno).
          ls -1t .env.bak.* 2>/dev/null | tail -n +4 | xargs -r rm --
          sed -i "s/^VERSAO=.*/VERSAO=${VERSAO}/" .env
          # O atualizar.sh cuida do resto: confere a tag, pull das imagens, up -d, prune.
          git fetch --quiet --tags --force origin
          sh deploy/atualizar.sh

      - name: Marcar no resumo
        if: success()
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: echo "✅ Produção atualizada para $VERSAO." >> "$GITHUB_STEP_SUMMARY"
